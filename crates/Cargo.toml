[workspace]
resolver = "2"
members = [
    "hbui-core",
    "hbui-terminal",
    "hbui-ipc",
    "hbui-mcp-bridge",
    "commander",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
license = "MIT OR Apache-2.0"
authors = ["rs-hbui Contributors"]

[workspace.dependencies]
hbui-core = { path = "hbui-core" }
hbui-terminal = { path = "hbui-terminal" }
hbui-ipc = { path = "hbui-ipc" }

# The semantic view is JSON, and so is the MCP wire. A JSON parser is the one
# piece worth buying rather than owning.
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Text is held in graphemes and measured in terminal cells. Those are two
# different questions, and neither is one this project wants to answer itself.
unicode-segmentation = "1.13"
unicode-width = "0.2"

# The terminal backend. Only `hbui-terminal` may name it: no crossterm type is
# allowed to reach `hbui-core`.
crossterm = { version = "0.29", features = ["bracketed-paste"] }

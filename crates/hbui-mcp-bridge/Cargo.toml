[package]
name = "hbui-mcp-bridge"
version.workspace = true
edition.workspace = true
license.workspace = true
authors.workspace = true
description = "A stdio MCP server that finds every hbui application in the session directory and forwards list_sessions / get_view / dispatch / capture_view to the session each call names, so applications can restart without the agent reconnecting."

[[bin]]
name = "hbui-mcp-bridge"
path = "src/main.rs"

[dependencies]
hbui-ipc.workspace = true
serde.workspace = true
serde_json.workspace = true

[dev-dependencies]
# Tests stand a real application session up behind the bridge.
hbui-core.workspace = true
